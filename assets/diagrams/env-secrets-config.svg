<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Runtime configuration and secret boundaries</title>
  <desc id="desc">One immutable image receives ordinary configuration and a scoped secret file at runtime.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="16" y="34" width="82" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="57" y="53" font-size="10" font-weight="600" fill="#0f172a">Image digest</text>
    <text x="57" y="68" font-size="8" fill="#64748b">same bytes</text>
    <rect x="16" y="108" width="82" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="57" y="127" font-size="10" fill="#1e3a8a">Config</text>
    <text x="57" y="141" font-size="8" fill="#1e40af">LOG_LEVEL</text>
    <rect x="218" y="108" width="86" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="261" y="127" font-size="10" fill="#1e3a8a">Secret file</text>
    <text x="261" y="141" font-size="8" fill="#1e40af">/run/secrets/…</text>
    <rect x="118" y="50" width="84" height="82" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="78" font-size="11" font-weight="600" fill="#0f172a">Container</text>
    <text x="160" y="98" font-size="9" fill="#475569">runtime only</text>
    <path d="M149 110h22v12h-22z" fill="#93c5fd" stroke="#2563eb"/>
    <path d="M153 110v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#2563eb" stroke-width="2"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="#2563eb">
    <path d="M98 56h14"/><path d="m107 50 10 6-10 6z"/>
    <path d="M98 130h14"/><path d="m107 124 10 6-10 6z"/>
    <path d="M218 130h-10"/><path d="m213 124-10 6 10 6z"/>
  </g>
</svg>
