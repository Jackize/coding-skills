<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Five foundational concepts</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="26" y="34" width="48" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="50" y="58" fill="#1e3a8a">latency</text>
    <rect x="82" y="34" width="48" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="106" y="58" fill="#1e3a8a">throughput</text>
    <rect x="138" y="34" width="48" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="162" y="58" fill="#1e3a8a">scalability</text>
    <rect x="194" y="34" width="48" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="218" y="58" fill="#1e3a8a">availability</text>
    <rect x="250" y="34" width="48" height="40" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
    <text x="274" y="58" fill="#fff">reliability</text>
    <text x="160" y="102" fill="#1e3a8a" font-weight="600">the vocabulary of system design</text>
    <text x="160" y="124" fill="#475569" font-size="10">latency = time/request · throughput = work/time</text>
    <text x="160" y="140" fill="#475569" font-size="10">scale = grow with load · availability = uptime</text>
    <text x="160" y="156" fill="#475569" font-size="10">reliability = availability + data integrity</text>
  </g>
</svg>
