<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener creation, redirect, cache, and analytics paths</title>
  <desc id="desc">Clients send create and redirect requests through a rate-limited gateway. Creation reserves a unique code using an ID generator and base62 encoder or a custom alias validator. Redirects use a protected cache with mapping-store fallback and publish click events asynchronously.</desc>
