    <rect x="58" y="56" width="44" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="113" y="20" width="48" height="34" rx="5"/>
    <rect x="113" y="108" width="48" height="34" rx="5"/>
    <rect x="171" y="9" width="39" height="25" rx="4"/>
    <rect x="220" y="9" width="39" height="25" rx="4"/>
    <rect x="171" y="47" width="88" height="25" rx="4"/>
    <rect x="173" y="105" width="49" height="31" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="266" y="47" width="48" height="55" rx="7"/>
    <rect x="228" y="145" width="37" height="24" rx="4"/>
    <rect x="275" y="141" width="39" height="32" rx="5"/>
  </g>
