    <path d="M161 29h10M210 21h10M259 22l7 31"/>
    <path d="M161 46l10 13M259 59h7"/>
    <path d="M161 120h12M222 120h18q9 0 9-9V88h17"/>
    <path d="M266 94h-17q-9 0-9 10v7h-18"/>
    <path d="M161 129l67 28M265 157h10"/>
    <path d="M113 134 48 96"/>
  </g>
  <path d="M48 89h10" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif" fill="#0f172a" text-anchor="middle">
    <g font-size="8.5" font-weight="600">
      <text x="27" y="82">Clients</text><text x="27" y="93">POST /links</text>
      <text x="80" y="73">Gateway</text><text x="80" y="84">+ load</text><text x="80" y="95">balancer</text>
      <text x="137" y="34">Link creation</text><text x="137" y="45">service</text>
      <text x="137" y="122">Redirect</text><text x="137" y="133">service</text>
      <text x="190" y="20">ID</text><text x="190" y="29">generator</text>
      <text x="239" y="20">base62</text><text x="239" y="29">encoder</text>
      <text x="215" y="58">Atomic uniqueness</text><text x="215" y="67">custom alias</text>
      <text x="197" y="118">Distributed</text><text x="197" y="128">cache</text>
      <text x="290" y="69">URL</text><text x="290" y="80">mapping</text><text x="290" y="91">store</text>
      <text x="246" y="160">Click queue</text>
