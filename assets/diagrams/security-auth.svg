<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Authenticate, authorize, then access</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="24" y="60" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="80" fill="#1e3a8a">authn</text><text x="60" y="96" fill="#475569" font-size="10">who are you?</text>
    <rect x="124" y="60" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="80" fill="#1e3a8a">authz</text><text x="160" y="96" fill="#475569" font-size="10">what may you do?</text>
    <rect x="224" y="60" width="72" height="44" rx="6" fill="#2563eb"/>
    <text x="260" y="80" fill="#fff">resource</text><text x="260" y="96" fill="#cfe3ff" font-size="10">data / API</text>
    <path d="M96 82h28M196 82h28" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="160" y="130" fill="#1e3a8a" font-weight="600">defense in depth</text>
    <text x="160" y="148" fill="#475569" font-size="10">HTTPS · hash+salt · JWT · RBAC/ABAC/OAuth2</text>
    <text x="160" y="164" fill="#475569" font-size="10">rate limit · CORS · input validation</text>
  </g>
</svg>
