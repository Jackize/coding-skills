<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Container replacement with persistent volume</title>
  <desc id="desc">Two successive containers attach to the same independently managed data volume.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="18" y="28" width="94" height="62" rx="6" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="65" y="52" font-size="11" fill="#64748b">old container</text>
    <text x="65" y="72" font-size="9" fill="#94a3b8">removed</text>
    <rect x="208" y="28" width="94" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="255" y="52" font-size="11" font-weight="600" fill="#1e3a8a">new container</text>
    <text x="255" y="72" font-size="9" fill="#1e40af">recreated</text>
    <ellipse cx="160" cy="124" rx="62" ry="18" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="98" y="116" width="124" height="28" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="160" cy="144" rx="62" ry="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="137" font-size="11" font-weight="600" fill="#1e3a8a">named volume</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M65 90v17c0 8 12 12 25 14"/><path d="M255 90v17c0 8-12 12-25 14"/>
  </g>
  <path d="m86 115 10 7-12 3zM234 115l-10 7 12 3z" fill="#2563eb"/>
</svg>
