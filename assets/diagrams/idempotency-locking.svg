<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Optimistic locking version check</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="20" y="50" width="92" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="66" y="70" fill="#1e3a8a">record</text><text x="66" y="85" fill="#475569" font-size="10">version = 3</text>
    <rect x="134" y="30" width="80" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="174" y="44" fill="#1e3a8a">write A</text><text x="174" y="58" fill="#475569" font-size="10">v3 → v4 ✓</text>
    <rect x="134" y="76" width="80" height="34" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="174" y="90" fill="#1e3a8a">write B</text><text x="174" y="104" fill="#475569" font-size="10">v3 → conflict</text>
    <rect x="236" y="50" width="64" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="268" y="70" fill="#1e3a8a">retry</text><text x="268" y="85" fill="#475569" font-size="10">re-read</text>
    <path d="M112 72h22M214 47h22M214 93h22" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="160" y="136" fill="#1e3a8a" font-weight="600">idempotency + version = safe retries</text>
    <text x="160" y="154" fill="#475569" font-size="10">optimistic: compare &amp; set · pessimistic: lock first</text>
  </g>
</svg>
