<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">The CAP trade-off triangle</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <path d="M160 22 40 148h240z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
    <text x="160" y="16" fill="#1e3a8a" font-weight="600">Consistency</text>
    <text x="30" y="168" fill="#1e3a8a" font-weight="600">Availability</text>
    <text x="290" y="168" fill="#1e3a8a" font-weight="600">Partition</text>
    <text x="160" y="76" fill="#1e3a8a" font-size="11">pick two</text>
    <text x="160" y="92" fill="#475569" font-size="10">CP = consistency + partition</text>
    <text x="160" y="108" fill="#475569" font-size="10">AP = availability + partition</text>
    <text x="160" y="130" fill="#475569" font-size="10">P is non-negotiable in practice</text>
  </g>
</svg>
