<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Decorator layers behavior while Proxy controls access</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="82" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Decorator chain</text>
  <g fill="#fff" stroke="#94a3b8">
    <rect x="20" y="46" width="124" height="96" rx="8"/>
    <rect x="34" y="60" width="96" height="68" rx="6"/>
    <rect x="48" y="74" width="68" height="40" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <g fill="#334155" font-family="system-ui,sans-serif" font-size="9"><text x="27" y="58">metrics</text><text x="41" y="72">retry</text><text x="82" y="98" text-anchor="middle">store</text></g>
  <text x="238" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Access proxy</text>
  <rect x="170" y="74" width="54" height="40" rx="5" fill="#fff" stroke="#94a3b8"/>
  <rect x="244" y="66" width="58" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <path d="M224 94h20" stroke="#64748b"/>
  <g fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle"><text x="197" y="91">Caller</text><text x="197" y="103">request</text><text x="273" y="89">Proxy</text><text x="273" y="102">allow?</text></g>
  <text x="160" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Same shape, different intent</text>
</svg>
