<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">A cache between the app and the database</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="20" y="66" width="76" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="58" y="86" fill="#1e3a8a">app</text><text x="58" y="101" fill="#475569" font-size="10">request</text>
    <rect x="122" y="66" width="76" height="44" rx="6" fill="#2563eb"/>
    <text x="160" y="86" fill="#fff">cache</text><text x="160" y="101" fill="#cfe3ff" font-size="10">RAM · fast</text>
    <rect x="224" y="66" width="76" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="262" y="86" fill="#1e3a8a">DB</text><text x="262" y="101" fill="#475569" font-size="10">source</text>
    <path d="M96 80h26M198 80h26" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="135" y="70" fill="#2563eb" font-size="10">hit</text>
    <text x="237" y="70" fill="#2563eb" font-size="10">miss</text>
    <text x="160" y="136" fill="#1e3a8a" font-weight="600">cache invalidation is the hard part</text>
    <text x="160" y="154" fill="#475569" font-size="10">aside · write-through · write-back · refresh-ahead</text>
  </g>
</svg>
