<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Failover from primary to standby</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="40" y="50" width="92" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="86" y="70" fill="#1e3a8a">primary</text><text x="86" y="86" fill="#475569" font-size="10">active</text>
    <rect x="188" y="50" width="92" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="234" y="70" fill="#1e3a8a">standby</text><text x="234" y="86" fill="#475569" font-size="10">passive</text>
    <path d="M132 73h56" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#2563eb"/></marker></defs>
    <text x="160" y="66" fill="#2563eb" font-size="10">failover</text>
    <text x="160" y="128" fill="#1e3a8a" font-weight="600">health check → switch → recover</text>
    <text x="160" y="146" fill="#475569" font-size="10">HA accepts small downtime</text>
    <text x="160" y="162" fill="#475569" font-size="10">FT aims for zero interruption</text>
  </g>
</svg>
