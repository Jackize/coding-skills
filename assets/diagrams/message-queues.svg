<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Producer, queue, and consumers</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="22" y="62" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="57" y="86" fill="#1e3a8a">producer</text>
    <rect x="122" y="56" width="76" height="52" rx="6" fill="#2563eb"/>
    <text x="160" y="79" fill="#fff">queue</text><text x="160" y="94" fill="#cfe3ff" font-size="10">FIFO · buffer</text>
    <rect x="228" y="42" width="70" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="263" y="56" fill="#1e3a8a">consumer</text><text x="263" y="70" fill="#475569" font-size="10">worker 1</text>
    <rect x="228" y="86" width="70" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="263" y="100" fill="#1e3a8a">consumer</text><text x="263" y="114" fill="#475569" font-size="10">worker 2</text>
    <path d="M92 82h30M198 76h30M198 96h30" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="160" y="142" fill="#1e3a8a" font-weight="600">async · decoupled</text>
    <text x="160" y="158" fill="#475569" font-size="10">backpressure controls the flow</text>
  </g>
</svg>
