<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">The three pillars of observability</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="24" y="46" width="80" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="64" y="66" fill="#1e3a8a" font-weight="600">logs</text><text x="64" y="82" fill="#475569" font-size="10">what happened</text>
    <rect x="120" y="46" width="80" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="66" fill="#1e3a8a" font-weight="600">metrics</text><text x="160" y="82" fill="#475569" font-size="10">how much / trend</text>
    <rect x="216" y="46" width="80" height="48" rx="6" fill="#2563eb"/>
    <text x="256" y="66" fill="#fff" font-weight="600">traces</text><text x="256" y="82" fill="#cfe3ff" font-size="10">which path / why</text>
    <text x="160" y="116" fill="#1e3a8a" font-weight="600">monitoring = "what" · observability = "why"</text>
    <text x="160" y="136" fill="#475569" font-size="10">detect with metrics &amp; alerts</text>
    <text x="160" y="152" fill="#475569" font-size="10">diagnose with logs &amp; traces</text>
  </g>
</svg>
