<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Resource limits and health state</title>
  <desc id="desc">A container operates inside CPU, memory, and PID limits while an independent healthcheck reports state.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="18" y="22" width="186" height="138" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="111" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">Container resource boundary</text>
  <g font-family="system-ui,sans-serif">
    <text x="34" y="70" font-size="9" fill="#475569">CPU</text>
    <rect x="70" y="61" width="112" height="11" rx="5" fill="#cbd5e1"/>
    <rect x="70" y="61" width="76" height="11" rx="5" fill="#2563eb"/>
    <text x="34" y="99" font-size="9" fill="#475569">Memory</text>
    <rect x="70" y="90" width="112" height="11" rx="5" fill="#cbd5e1"/>
    <rect x="70" y="90" width="58" height="11" rx="5" fill="#60a5fa"/>
    <text x="34" y="128" font-size="9" fill="#475569">PIDs</text>
    <rect x="70" y="119" width="112" height="11" rx="5" fill="#cbd5e1"/>
    <rect x="70" y="119" width="34" height="11" rx="5" fill="#93c5fd"/>
  </g>
  <rect x="226" y="48" width="76" height="84" rx="8" fill="#fff" stroke="#94a3b8"/>
  <circle cx="264" cy="76" r="15" fill="#dbeafe" stroke="#2563eb"/>
  <path d="m256 76 6 6 11-14" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="264" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#0f172a">healthy</text>
  <text x="264" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">status ≠ running</text>
  <path d="M204 90h16" stroke="#2563eb" stroke-width="2"/>
  <path d="m215 84 10 6-10 6z" fill="#2563eb"/>
</svg>
