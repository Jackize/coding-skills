<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Strategy selects one policy and Observer fans out facts</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="76" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Choose one Strategy</text>
  <rect x="24" y="44" width="104" height="34" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="76" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#334155">Price context</text>
  <path d="M76 78v24m0 0-34 23m34-23 34 23" stroke="#64748b" fill="none"/>
  <text x="42" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Standard</text><text x="110" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Campaign</text>
  <text x="238" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Notify many Observers</text>
