<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Cache layer</title>
  <rect width="320" height="180" fill="#f7f7f5"/>
  <rect x="20" y="70" width="70" height="40" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <text x="55" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">App</text>
  <path d="M90 90 H130" stroke="#5c5c5c"/>
  <rect x="130" y="70" width="70" height="40" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">Cache</text>
  <path d="M200 90 H240" stroke="#5c5c5c"/>
  <rect x="240" y="70" width="60" height="40" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <text x="270" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">DB</text>
  <text x="160" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5c5c5c">hit → cache · miss → DB</text>
</svg>
