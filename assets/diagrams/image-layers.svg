<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Image and Dockerfile</title>
  <rect width="320" height="180" fill="#f7f7f5"/>
  <rect x="20" y="30" width="120" height="120" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <text x="80" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5c5c5c">Dockerfile</text>
  <text x="80" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">FROM …</text>
  <text x="80" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">COPY …</text>
  <text x="80" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">RUN …</text>
  <path d="M140 90 H180" stroke="#5c5c5c"/><polygon points="180,85 190,90 180,95" fill="#5c5c5c"/>
  <rect x="190" y="50" width="110" height="80" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1a1a1a">Image</text>
</svg>
