<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">A load balancer spreading requests</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <text x="160" y="16" fill="#1e3a8a" font-weight="600">load balancer</text>
    <rect x="120" y="26" width="80" height="28" rx="6" fill="#2563eb"/>
    <text x="160" y="44" fill="#fff">LB</text>
    <rect x="28" y="92" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="66" y="110" fill="#1e3a8a">server A</text><text x="66" y="124" fill="#475569" font-size="10">round robin</text>
    <rect x="122" y="92" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="110" fill="#1e3a8a">server B</text><text x="160" y="124" fill="#475569" font-size="10">least conn.</text>
    <rect x="216" y="92" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="254" y="110" fill="#1e3a8a">server C</text><text x="254" y="124" fill="#475569" font-size="10">ip hash</text>
    <path d="M160 54v12M66 92v-16M160 92v-16M254 92v-16" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="160" y="156" fill="#475569" font-size="10">scale out + high availability</text>
  </g>
</svg>
