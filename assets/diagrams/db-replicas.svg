<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Database replicas</title>
  <rect width="320" height="180" fill="#f7f7f5"/>
  <rect x="120" y="20" width="80" height="40" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1a1a1a">Primary</text>
  <path d="M160 60 V85" stroke="#5c5c5c"/>
  <path d="M100 85 H220" stroke="#5c5c5c"/>
  <path d="M100 85 V100" stroke="#5c5c5c"/><path d="M160 85 V100" stroke="#5c5c5c"/><path d="M220 85 V100" stroke="#5c5c5c"/>
  <rect x="60" y="100" width="80" height="36" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <rect x="140" y="100" width="80" height="36" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <rect x="220" y="100" width="80" height="36" rx="4" fill="#fff" stroke="#d4d4d0"/>
  <text x="100" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">Replica</text>
  <text x="180" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">Replica</text>
  <text x="260" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1a1a1a">Replica</text>
  <text x="160" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5c5c5c">writes → primary · reads → replicas</text>
</svg>
