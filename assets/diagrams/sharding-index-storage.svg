<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">A database split into shards</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <text x="160" y="18" fill="#1e3a8a" font-weight="600">one database → many shards</text>
    <rect x="118" y="30" width="84" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="49" fill="#1e3a8a">all data</text>
    <text x="106" y="76" fill="#2563eb" font-size="14">▼ shard key</text>
    <rect x="30" y="86" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="68" y="104" fill="#1e3a8a">shard 1</text><text x="68" y="118" fill="#475569" font-size="10">A–I</text>
    <rect x="122" y="86" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="104" fill="#1e3a8a">shard 2</text><text x="160" y="118" fill="#475569" font-size="10">J–S</text>
    <rect x="214" y="86" width="76" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="252" y="104" fill="#1e3a8a">shard 3</text><text x="252" y="118" fill="#475569" font-size="10">T–Z</text>
    <text x="160" y="150" fill="#475569" font-size="10">range · hash · directory · geo</text>
    <text x="160" y="166" fill="#475569" font-size="10">index = fast reads, slower writes</text>
  </g>
</svg>
