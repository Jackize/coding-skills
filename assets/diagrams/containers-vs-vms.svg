<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Containers compared with virtual machines</title>
  <desc id="desc">Containers share a host kernel while virtual machines include separate guest kernels.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="80" y="20" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Containers</text>
  <text x="240" y="20" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Virtual machines</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="14" y="32" width="62" height="38" rx="5"/><rect x="84" y="32" width="62" height="38" rx="5"/>
    <rect x="174" y="32" width="62" height="38" rx="5"/><rect x="244" y="32" width="62" height="38" rx="5"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">
    <text x="45" y="55">Process A</text><text x="115" y="55">Process B</text>
    <text x="205" y="55">App A</text><text x="275" y="55">App B</text>
  </g>
  <g fill="#fff" stroke="#94a3b8">
    <rect x="14" y="82" width="132" height="30" rx="4"/>
    <rect x="174" y="82" width="62" height="30" rx="4"/><rect x="244" y="82" width="62" height="30" rx="4"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#334155" text-anchor="middle">
    <text x="80" y="101">Shared host kernel</text>
    <text x="205" y="101">Guest kernel</text><text x="275" y="101">Guest kernel</text>
  </g>
  <rect x="14" y="126" width="292" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="160" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Host / hypervisor boundary</text>
</svg>
