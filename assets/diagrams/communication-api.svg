<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Communication styles from transport to API</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="20" y="70" width="52" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="46" y="93" fill="#1e3a8a">TCP</text><text x="46" y="109" fill="#475569" font-size="10">reliable</text>
    <rect x="82" y="70" width="52" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="108" y="93" fill="#1e3a8a">UDP</text><text x="108" y="109" fill="#475569" font-size="10">fast</text>
    <rect x="144" y="50" width="60" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="174" y="80" fill="#1e3a8a">HTTP</text><text x="174" y="96" fill="#475569" font-size="10">web</text>
    <rect x="214" y="50" width="52" height="74" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="78" fill="#1e3a8a">REST</text><text x="240" y="94" fill="#475569" font-size="10">API</text>
    <rect x="276" y="50" width="28" height="74" rx="6" fill="#2563eb"/>
    <text x="290" y="90" fill="#fff" font-size="10">RPC</text>
    <text x="160" y="146" fill="#1e3a8a" font-weight="600">transport → application → API style</text>
    <text x="160" y="164" fill="#475569" font-size="10">pick by reliability, speed, and audience</text>
  </g>
</svg>
