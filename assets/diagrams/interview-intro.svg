<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">A system design interview flows through four steps</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">
    <rect x="14" y="20" width="66" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="47" y="46" fill="#1e3a8a">1</text><text x="47" y="60" fill="#1e3a8a">Clarify</text>
    <rect x="86" y="20" width="66" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="119" y="46" fill="#1e3a8a">2</text><text x="119" y="60" fill="#1e3a8a">Sketch</text>
    <rect x="158" y="20" width="66" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="191" y="46" fill="#1e3a8a">3</text><text x="191" y="60" fill="#1e3a8a">Deep-dive</text>
    <rect x="230" y="20" width="72" height="58" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
    <text x="266" y="46" fill="#fff">4</text><text x="266" y="60" fill="#fff">Decide</text>
    <text x="160" y="106" fill="#1e3a8a" font-weight="600">open problem → architecture → trade-offs</text>
    <text x="160" y="130" fill="#475569" font-size="10">requirements · components · consistency · scale</text>
    <path d="M160 140h0" stroke="#2563eb"/>
    <text x="160" y="156" fill="#475569" font-size="10">thinking &amp; communication &gt; a perfect answer</text>
  </g>
</svg>
