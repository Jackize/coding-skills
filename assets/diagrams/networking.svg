<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Published port and private service network</title>
  <desc id="desc">Host traffic reaches a proxy and API while a database remains on a private backend network.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="72" y="20" width="232" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="138" y="98" width="166" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="292" y="38" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb">frontend network</text>
  <text x="292" y="116" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">backend network</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="10" y="54" width="48" height="38" rx="5" fill="#fff" stroke="#94a3b8"/>
    <text x="34" y="77" font-size="10" fill="#334155">Host</text>
    <rect x="90" y="42" width="58" height="34" rx="5" fill="#fff" stroke="#2563eb"/>
    <text x="119" y="63" font-size="10" fill="#0f172a">Proxy :80</text>
    <rect x="178" y="56" width="58" height="44" rx="5" fill="#fff" stroke="#2563eb"/>
    <text x="207" y="82" font-size="10" fill="#0f172a">API :3000</text>
    <rect x="178" y="122" width="58" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
    <text x="207" y="141" font-size="10" fill="#0f172a">DB :5432</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="#2563eb">
    <path d="M58 72h26"/><path d="m79 66 10 6-10 6z"/>
    <path d="M148 59h24"/><path d="m167 53 10 6-10 6z"/>
    <path d="M207 100v16"/><path d="m201 111 6 10 6-10z"/>
  </g>
  <text x="70" y="62" font-family="system-ui,sans-serif" font-size="8" fill="#2563eb">:8080</text>
</svg>
