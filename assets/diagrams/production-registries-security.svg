<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Immutable image promotion and security controls</title>
  <desc id="desc">A tested image digest moves through a registry to deployment with scan, signature, and runtime controls.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="12" y="60" width="72" height="52" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="48" y="82" font-size="10" font-weight="600" fill="#0f172a">CI build</text>
    <text x="48" y="99" font-size="8" fill="#64748b">test + SBOM</text>
    <rect x="124" y="42" width="72" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="68" font-size="11" font-weight="600" fill="#1e3a8a">Registry</text>
    <path d="M143 85h34v25h-34z" fill="#fff" stroke="#2563eb"/>
    <text x="160" y="102" font-size="8" fill="#1e40af">sha256:…</text>
    <rect x="236" y="60" width="72" height="52" rx="6" fill="#fff" stroke="#2563eb"/>
    <text x="272" y="82" font-size="10" font-weight="600" fill="#0f172a">Runtime</text>
    <text x="272" y="99" font-size="8" fill="#64748b">least privilege</text>
    <circle cx="160" cy="20" r="11" fill="#eff6ff" stroke="#2563eb"/>
    <path d="m154 20 4 4 8-9" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="154" font-size="9" fill="#2563eb">immutable digest promoted; configuration stays external</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="#2563eb">
    <path d="M84 86h34"/><path d="m113 80 10 6-10 6z"/>
    <path d="M196 86h34"/><path d="m225 80 10 6-10 6z"/>
    <path d="M160 31v7"/><path d="m154 33 6 10 6-10z"/>
  </g>
  <text x="104" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#2563eb">push</text>
  <text x="216" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#2563eb">pull by digest</text>
</svg>
